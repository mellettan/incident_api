[project]
name = "incident-api"
version = "1.0.0"
description = "Сервис учёта инцидентов: FastAPI, SQLAlchemy 2.0 async, PostgreSQL, Alembic"
readme = "README.md"
authors = [{ name = "Roman Medvedev", email = "roma23470@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1,<0.122",
    "uvicorn[standard]>=0.38.0,<0.39",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.17.1,<2",
    "pydantic>=2.12.4,<3",
    "pydantic-settings>=2.11.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "ruff>=0.14.4",
    "mypy>=1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["incident_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["incident_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=incident_api --cov-report=term-missing"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["incident_api"]
